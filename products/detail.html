<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>제품 상세 | 바이오프로테크</title>
<link rel="stylesheet" href="../Bioprotech Design System/colors_and_type.css" />
<link rel="stylesheet" href="../assets/css/site.css" />
<style>
  .detail-grid {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 64px;
    align-items: start;
  }
  .gallery .main-img {
    height: 420px;
  }
  .gallery .thumbs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 8px;
  }
  .gallery .thumbs .placeholder-img { min-height: 80px; }
  .info .name {
    font-size: 32px; font-weight: 700;
    color: var(--bp-accent5); line-height: 1.2;
    letter-spacing: -0.01em;
    margin-bottom: 10px;
  }
  .info .name .en {
    display: block; font-size: 13px; font-weight: 400;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--bp-dk2); opacity: 0.7; margin-top: 10px;
  }
  .info .tag {
    font-size: 14px; line-height: 1.75;
    color: var(--bp-dk2); opacity: 0.85;
    margin-bottom: 24px;
  }
  .spec-block { margin-top: 32px; }
  .spec-block h3 {
    font-size: 13px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--bp-accent5);
    margin-bottom: 12px; font-weight: 700;
  }
  .spec-table {
    width: 100%;
    border-top: 1px solid var(--bp-lt2);
  }
  .spec-table tr { border-bottom: 1px solid var(--bp-lt2); }
  .spec-table th, .spec-table td {
    padding: 14px 16px;
    text-align: left;
    font-size: 13px;
    vertical-align: top;
  }
  .spec-table th {
    width: 40%;
    background: #F7F8FA;
    font-weight: 700;
    color: var(--bp-dk2);
    letter-spacing: 0.05em;
  }
  .spec-table td { color: var(--bp-dk2); opacity: 0.9; }
  .actions { display: flex; gap: 12px; margin-top: 32px; flex-wrap: wrap; }
  .related { margin-top: 100px; }
  .related h3 {
    font-size: 20px; font-weight: 700; color: var(--bp-accent5);
    margin-bottom: 20px;
  }
  .rel-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--bp-lt2);
    border: 1px solid var(--bp-lt2);
  }
  .rel-card {
    background: #fff; padding: 16px;
    display: flex; flex-direction: column; gap: 8px;
    min-height: 140px; transition: background .2s;
  }
  .rel-card:hover { background: var(--bp-lt-bluegray); }
  .rel-card h4 { font-size: 13px; font-weight: 700; color: var(--bp-dk2); }
  .rel-card p { font-size: 11px; color: var(--bp-dk2); opacity: 0.7; margin-top: auto; }

  /* 261008: 카탈로그 기반 상세 */
  .gallery .main-img { height: 420px; border-radius: 0; background: #fff; border: 1px solid #e5e5ea; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .gallery .main-img img { max-width: 92%; max-height: 92%; object-fit: contain; mix-blend-mode: multiply; }
  .gallery .thumbs button { height: 80px; border: 1px solid #e5e5ea; border-radius: 10px; background: #fff; padding: 6px; cursor: pointer; }
  .gallery .thumbs button.on { border-color: #1d1d1f; }
  .gallery .thumbs img { width: 100%; height: 100%; object-fit: contain; }
  .catname { font-size: 12px; color: #6e6e73; margin-top: -14px; margin-bottom: 18px; }
  .desc { font-size: 15px; line-height: 1.8; color: #1d1d1f; margin-bottom: 18px; }
  .feat { margin: 0 0 8px; padding: 0; list-style: none; display: grid; gap: 8px; }
  .feat li { position: relative; padding-left: 18px; font-size: 14px; line-height: 1.65; color: #424245; }
  .feat li::before { content: ''; position: absolute; left: 2px; top: 9px; width: 6px; height: 6px; border-radius: 50%; background: var(--bp-accent5); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { font-size: 12px; padding: 4px 10px; border-radius: 980px; background: #f5f5f7; color: #424245; }
  .models { margin-top: 72px; }
  .models h3 { font-size: 20px; font-weight: 600; color: #1d1d1f; margin-bottom: 6px; }
  .models .sub { font-size: 13px; color: #6e6e73; margin-bottom: 18px; }
  .mtable-wrap { overflow-x: auto; border: 1px solid #e5e5ea; border-radius: 14px; }
  .mtable { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
  .mtable th { background: #f5f5f7; text-align: left; font-weight: 600; padding: 12px 14px; white-space: nowrap; color: #1d1d1f; border-bottom: 1px solid #e5e5ea; }
  .mtable td { padding: 11px 14px; border-bottom: 1px solid #f0f0f2; color: #424245; vertical-align: top; }
  .mtable tr:last-child td { border-bottom: 0; }
  .mtable td:first-child { font-weight: 600; color: #1d1d1f; white-space: nowrap; }
  .mfilter { margin-bottom: 12px; }
  .mfilter input { width: 100%; max-width: 320px; padding: 10px 14px; border: 1px solid #d2d2d7; border-radius: 10px; font: inherit; font-size: 14px; }
  .dl-cat { display: flex; align-items: center; gap: 16px; padding: 16px; border: 1px solid #e5e5ea; border-radius: 14px; }
  .dl-cat img { width: 56px; height: 78px; object-fit: cover; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .dl-cat b { display: block; font-size: 14px; color: #1d1d1f; }
  .dl-cat span { font-size: 12px; color: #6e6e73; }
  .dl-cat a { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--bp-accent5); white-space: nowrap; }
  @media (max-width: 900px) {
    .detail-grid { grid-template-columns: 1fr; gap: 32px; }
    .rel-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
<link rel="stylesheet" href="../assets/css/theme-apple.css" />
</head>
<body data-base=".." data-nav="products">

<div id="bp-header-slot"></div>

<section class="page-hero">
  <nav class="breadcrumb">
        <a href="index.html">Products</a>
    <span class="sep">/</span>
    <a id="crumb-cat" href="#"></a>
    <span class="sep">/</span>
    <span id="crumb-prod"></span>
  </nav>
  <h1 id="prod-h1"></h1>
</section>

<main class="page-body">
  <div class="detail-grid">
    <div class="gallery">
      <div class="main-img" id="main-img"><div class="placeholder-img" data-label="Image pending" style="width:100%;height:100%"></div></div>
      <div class="thumbs" id="thumbs"></div>
    </div>
    <div class="info">
      <div class="name" id="name-block"> </div>
      <div id="desc-wrap"></div>

      <div class="spec-block">
        <h3>Specifications</h3>
        <table class="spec-table"><tbody id="spec-body"></tbody></table>
      </div>

      <div class="spec-block">
        <h3>Downloads</h3>
        <div id="dl-wrap"></div>
      </div>

      <div class="actions">
        <a href="../support/contact.html?subject=quote" class="btn btn-primary" id="quote-btn">
          <span class="ko-only">견적 문의</span><span class="en-only">Get a Quote</span><span class="es-only">Solicitar presupuesto</span> <span class="arrow">→</span>
        </a>
        <a href="../downloads/index.html" class="btn btn-ghost" id="cat-btn"><span class="ko-only">카탈로그 다운로드</span><span class="en-only">Download Catalog</span><span class="es-only">Descargar catálogo</span></a>
      </div>
    </div>
  </div>

  <section class="models" id="models" hidden>
    <h3 id="models-title">Models</h3>
    <p class="sub" id="models-sub"></p>
    <div class="mfilter"><input type="search" id="mfilter" /></div>
    <div class="mtable-wrap"><table class="mtable" id="mtable"></table></div>
    <div id="acc-wrap"></div>
  </section>

  <section class="related">
    <h3 id="related-title">같은 카테고리 제품</h3>
    <div class="rel-grid" id="rel-grid"></div>
  </section>

  <script>
    // Localize static phrase when lang is KO (EN handled by existing inline script)
    (function(){ if (window.bpLang && window.bpLang()==='ko') {
      document.getElementById('related-title').textContent = '같은 카테고리 제품';
    }})();
  </script>
</main>

<div id="bp-footer-slot"></div>
<script src="../assets/js/data-bundle.js"></script>
<script src="../assets/js/chrome.js"></script>
<script>
(async function () {
  const id = window.bpQuery('id');
  if (!id) { location.replace('index.html'); return; }

  const res = await fetch('../assets/data/products.json');
  const data = await res.json();
  const lang = window.bpLang();
  const prod = data.products.find(p => p.id === id);
  if (!prod) {
    document.getElementById('prod-h1').textContent = 'Not Found';
    return;
  }
  const cat = data.categories.find(c => c.id === prod.cat);

  document.title = `${prod.name[lang]} | 바이오프로테크`;
  const L = (ko, en, es) => lang === 'ko' ? ko : lang === 'es' ? (es || en) : en;
  const tx = o => o ? (o[lang] || o.en || o.ko || '') : '';
  const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  document.getElementById('crumb-cat').textContent = cat.name[lang];
  document.getElementById('crumb-cat').href = `category.html?cat=${cat.id}`;
  document.getElementById('crumb-prod').textContent = prod.name[lang];
  document.getElementById('prod-h1').textContent = prod.name[lang];
  document.getElementById('name-block').firstChild.nodeValue = prod.name[lang];
  document.getElementById('quote-btn').href = `../support/contact.html?subject=quote&product=${encodeURIComponent(prod.name.en)}`;

  // 이미지
  const imgs = prod.images || [];
  if (imgs.length) {
    const main = document.getElementById('main-img');
    const show = k => {
      main.innerHTML = `<img src="../assets/img/products/${imgs[k]}" alt="${esc(prod.name[lang])}">`;
      document.querySelectorAll('#thumbs button').forEach((b, n) => b.classList.toggle('on', n === k));
    };
    document.getElementById('thumbs').innerHTML = imgs.length > 1 ? imgs.map((f, k) =>
      `<button type="button" data-k="${k}" aria-label="image ${k+1}"><img src="../assets/img/products/${f}" alt=""></button>`).join('') : '';
    document.getElementById('thumbs').onclick = e => { const b = e.target.closest('button'); if (b) show(+b.dataset.k); };
    show(0);
  }

  // 설명
  const dw = document.getElementById('desc-wrap');
  if (prod.summary) {
    const feats = (prod.features && (prod.features[lang] || prod.features.en)) || [];
    dw.innerHTML = `<p class="desc">${esc(tx(prod.summary))}</p>` +
      (feats.length ? `<ul class="feat">${feats.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : '');
  } else {
    dw.innerHTML = `<div class="placeholder-empty"><strong>${L('제품 설명','Product Description','Descripción del producto')}</strong>${L('해당 제품의 카탈로그가 준비되면 상세 설명과 사양이 반영됩니다.','Details will be added once the catalog for this product is available.','Los detalles se añadirán cuando el catálogo esté disponible.')}</div>`;
  }

  // 주요 사양 표
  const rows = [];
  if (prod.spec && prod.spec.rows) rows.push([L('모델 수','Models','Modelos'), `${prod.spec.rows.length} ${L('종','models','modelos')}`]);
  if (prod.keyspecs) Object.entries(prod.keyspecs).forEach(([k, v]) => rows.push([k, v]));
  if (prod.material) rows.push([L('소재','Material','Material'), prod.material]);
  if (prod.packing) rows.push([L('포장 단위','Packing Unit','Embalaje'), prod.packing]);
  if (prod.applications && prod.applications.length) rows.push([L('적용 분야','Applications','Aplicaciones'), `<div class="chips">${prod.applications.map(a => `<span>${esc(a)}</span>`).join('')}</div>`]);
  document.getElementById('spec-body').innerHTML = rows.length
    ? rows.map(([k, v]) => `<tr><th>${esc(k)}</th><td>${String(v).startsWith('<div') ? v : esc(v)}</td></tr>`).join('')
    : `<tr><th>${L('사양','Specifications','Especificaciones')}</th><td>${L('카탈로그 준비 중','Catalog in preparation','Catálogo en preparación')}</td></tr>`;

  // 다운로드
  const dl = document.getElementById('dl-wrap');
  if (prod.catalog) {
    const f = prod.catalog.file, cover = f.replace('.pdf', '-cover.jpg');
    dl.innerHTML = `<div class="dl-cat"><img src="../assets/catalog/${cover}" alt=""><div><b>${esc(prod.catalog.name || f)}</b><span>PDF · ${L('제품 카탈로그','Product catalog','Catálogo')}</span></div><a href="../assets/catalog/${f}" target="_blank" rel="noopener">${L('카탈로그 보기','View catalog','Ver catálogo')} ↗</a></div>`;
    const cb = document.getElementById('cat-btn'); cb.href = `../assets/catalog/${f}`; cb.setAttribute('download', '');
  } else {
    dl.innerHTML = `<p style="font-size:13px;color:#6e6e73">${L('카탈로그 준비 중입니다.','Catalog in preparation.','Catálogo en preparación.')}</p>`;
  }

  // 모델 표
  if (prod.spec && prod.spec.rows && prod.spec.rows.length) {
    const sec = document.getElementById('models'); sec.hidden = false;
    document.getElementById('models-title').textContent = L('모델 사양','Model Specifications','Especificaciones de modelos');
    document.getElementById('models-sub').textContent = L(`카탈로그 기준 ${prod.spec.rows.length}개 모델`, `${prod.spec.rows.length} models per catalog`, `${prod.spec.rows.length} modelos según catálogo`);
    const inp = document.getElementById('mfilter');
    inp.placeholder = L('모델명·사양 검색', 'Search model or spec', 'Buscar modelo');
    const tbl = document.getElementById('mtable');
    const draw = q => {
      const rs = prod.spec.rows.filter(r => !q || r.join(' ').toLowerCase().includes(q.toLowerCase()));
      tbl.innerHTML = `<thead><tr>${prod.spec.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>` +
        (rs.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${prod.spec.columns.length}">${L('검색 결과가 없습니다.','No matching models.','Sin resultados.')}</td></tr>`) + '</tbody>';
    };
    inp.oninput = () => draw(inp.value.trim()); draw('');
    if (prod.accessories) {
      const a = prod.accessories;
      document.getElementById('acc-wrap').innerHTML = `<h3 style="margin-top:40px">${L('액세서리','Accessories','Accesorios')}</h3><div class="mtable-wrap" style="margin-top:14px"><table class="mtable"><thead><tr>${a.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${a.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    }
  }

  if (lang === 'en') {
    document.getElementById('related-title').textContent = 'Related Products';
  } else if (lang === 'es') {
    document.getElementById('related-title').textContent = 'Productos relacionados';
  }

  const related = data.products
    .filter(p => p.cat === prod.cat && p.id !== prod.id)
    .slice(0, 4);

  document.getElementById('rel-grid').innerHTML = related.map(p => `
    <a class="rel-card" href="detail.html?id=${p.id}">
      ${p.images ? `<img src="../assets/img/products/${p.images[0]}" alt="" style="height:90px;object-fit:contain;mix-blend-mode:multiply">` : ''}
      <h4>${p.name[lang]}</h4>
      <p>${p.tagline[lang]}</p>
    </a>
  `).join('');
})();
</script>
</body>
</html>
