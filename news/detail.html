<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>뉴스 | 바이오프로테크</title>
<link rel="stylesheet" href="../Bioprotech Design System/colors_and_type.css" />
<link rel="stylesheet" href="../assets/css/site.css" />
<style>
  .article-head { padding-bottom: 32px; border-bottom: 1px solid var(--bp-lt2); margin-bottom: 40px; }
  .article-meta { display: flex; gap: 16px; font-size: 12px; letter-spacing: 0.1em; color: var(--bp-dk2); opacity: 0.7; margin-bottom: 16px; }
  .article-meta .tag { background: var(--bp-accent1); color: #fff; padding: 4px 10px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; }
  .article-title { font-size: 32px; font-weight: 700; color: var(--bp-accent5); line-height: 1.3; letter-spacing: -0.01em; }
  .article-body { font-size: 15px; line-height: 1.9; color: var(--bp-dk2); }
  .article-body p { margin-bottom: 20px; }
  .article-nav { margin-top: 64px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .article-text p { font-size: 15px; line-height: 1.85; color: #1d1d1f; margin: 0; word-break: keep-all; }
  .article-text p.gap { height: 14px; }
  .article-table { overflow-x: auto; margin: 12px 0; }
  .article-table table { border-collapse: collapse; font-size: 14px; min-width: 560px; }
  .article-table th, .article-table td { border: 1px solid #d2d2d7; padding: 8px 12px; text-align: left; }
  .article-table th { background: #f5f5f7; font-weight: 600; }
  .article-visual { margin-bottom: 36px; }
  .av-lead { display: grid; grid-template-columns: 1.75fr 1fr; gap: 16px; align-items: start; }
  .av-lead figure, .article-gallery figure { margin: 0; background: #f3f5f8; }
  .av-lead img, .article-gallery img { display: block; width: 100%; height: auto; }
  .av-facts { display: grid; grid-template-columns: repeat(4, 1fr); margin: 28px 0 0; border-top: 2px solid #0a1428; border-bottom: 1px solid #d2d2d7; }
  .av-facts > div { padding: 18px 16px; border-left: 1px solid #d2d2d7; }
  .av-facts > div:first-child { border-left: 0; padding-left: 0; }
  .av-facts dt { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: #14306b; margin-bottom: 6px; }
  .av-facts dd { margin: 0; font-size: 15px; font-weight: 600; color: #1d1d1f; line-height: 1.5; word-break: keep-all; }
  .article-gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 36px; }
  .article-gallery:empty, .article-visual:empty { display: none; }
  @media (max-width: 900px) { .av-lead { grid-template-columns: 1fr; } .av-facts { grid-template-columns: 1fr 1fr; } .av-facts > div:nth-child(3) { border-left: 0; padding-left: 0; } .article-gallery { grid-template-columns: 1fr 1fr; } }
  #summary { font-size: 16px; line-height: 1.9; color: #1d1d1f; word-break: keep-all; }
</style>
<link rel="stylesheet" href="../assets/css/theme-apple.css" />
</head>
<body data-base=".." data-nav="news">

<div id="bp-header-slot"></div>

<section class="page-hero">
  <nav class="breadcrumb">
        <a href="index.html">News</a><span class="sep">/</span>
    <span id="crumb"></span>
  </nav>
  <h1 id="h1"></h1>
</section>

<main class="page-body">
  <div class="article-head">
    <div class="article-meta">
      <span class="tag" id="tag"></span>
      <span id="date"></span>
    </div>
    <h2 class="article-title" id="title"></h2>
  </div>
  <div class="article-body">
    <div class="article-visual" id="visual"></div>
    <p id="summary"></p>
    <div class="article-text" id="body"></div>
    <div class="article-gallery" id="gallery"></div>
    <p class="article-src" id="src"></p>
  </div>
  <div class="article-nav">
    <a href="index.html" class="btn btn-ghost"><span class="ko-only">← 목록으로</span><span class="en-only">← Back to list</span><span class="es-only">← Volver a la lista</span></a>
    <div>
      <a href="#" class="btn btn-ghost" id="prev"><span class="ko-only">← 이전</span><span class="en-only">← Prev</span><span class="es-only">← Anterior</span></a>
      <a href="#" class="btn btn-ghost" id="next"><span class="ko-only">다음 →</span><span class="en-only">Next →</span><span class="es-only">Siguiente →</span></a>
    </div>
  </div>
</main>

<div id="bp-footer-slot"></div>
<script src="../assets/js/data-bundle.js"></script>
<script src="../assets/js/chrome.js"></script>
<script>
(async function () {
  const id = window.bpQuery('id');
  const res = await fetch('../assets/data/news.json');
  const data = await res.json();
  const lang = window.bpLang();
  const idx = data.items.findIndex(i => i.id === id);
  const item = data.items[idx];
  if (!item) { document.getElementById('h1').textContent = 'Not Found'; return; }

  document.title = `${item.title[lang]} | 바이오프로테크`;
  document.getElementById('crumb').textContent = item.title[lang];
  document.getElementById('h1').textContent = item.title[lang];
  document.getElementById('tag').textContent = item.tag[lang];
  document.getElementById('date').textContent = item.date;
  document.getElementById('title').textContent = item.title[lang];
  // 261008: 이미지 중심 기사 (lead 이미지 · 핵심 정보 · 갤러리)
  const pick = v => typeof v === 'string' ? v : (v[lang] || v.en || v.ko);
  if (item.lead) {
    document.getElementById('visual').innerHTML =
      `<div class="av-lead">${item.lead.map(l => `<figure><img src="${pick(l.src)}" alt="${l.alt || ''}"></figure>`).join('')}</div>` +
      (item.facts ? `<dl class="av-facts">${item.facts.map(f => `<div><dt>${pick(f.k)}</dt><dd>${pick(f.v)}</dd></div>`).join('')}</dl>` : '');
  }
  if (item.gallery) {
    document.getElementById('gallery').innerHTML = item.gallery.map(g => `<figure><img src="${pick(g.src)}" alt="${g.alt || ''}" loading="lazy"></figure>`).join('');
  }
  // 261008: 본문(body)이 있으면 원문 전체 표시, 없으면 요약 표시
  const esc = v => String(v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const body = item.body ? (item.body[lang] || item.body.ko || item.body.en) : '';
  if (body) {
    document.getElementById('summary').remove();
    const lines = body.split('\n'); let html = '', tbl = [];
    const flush = () => { if (tbl.length) { html += '<div class="article-table"><table>' + tbl.map((r, k) => '<tr>' + r.split('|').map(c => (k ? '<td>' : '<th>') + esc(c.trim()) + (k ? '</td>' : '</th>')).join('') + '</tr>').join('') + '</table></div>'; tbl = []; } };
    lines.forEach(l => { if (l.includes(' | ')) { tbl.push(l); return; } flush(); html += l.trim() ? '<p>' + esc(l) + '</p>' : '<p class="gap"></p>'; });
    flush();
    document.getElementById('body').innerHTML = html;
  } else {
    document.getElementById('summary').textContent = item.summary[lang];
  }

  const prev = data.items[idx - 1];
  const next = data.items[idx + 1];
  document.getElementById('prev').style.visibility = prev ? 'visible' : 'hidden';
  document.getElementById('next').style.visibility = next ? 'visible' : 'hidden';
  if (prev) document.getElementById('prev').href = `detail.html?id=${prev.id}`;
  if (next) document.getElementById('next').href = `detail.html?id=${next.id}`;
})();
</script>
</body>
</html>
